version: 2

models:

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_products
    columns:
      - name: product
        tests:
          - not_null

  - name: fct_loans
    columns:
      - name: loan_id
        tests:
          - unique
          - not_null

  - name: fct_repayments
    columns:
      - name: repayment_id
        tests:
          - unique
          - not_null
